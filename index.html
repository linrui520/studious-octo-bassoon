<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>网络延迟测试 · 轻量工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #f6f9fc 0%, #e9f0f5 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .card {
            max-width: 680px;
            width: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 2.5rem;
            padding: 2rem 2rem 2.5rem;
            box-shadow: 0 20px 40px -12px rgba(0, 20, 30, 0.25),
                        0 8px 24px -6px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: box-shadow 0.2s;
        }
        h1 {
            font-size: 1.9rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: #0b2a3b;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.3rem;
        }
        h1 small {
            font-size: 0.9rem;
            font-weight: 400;
            color: #3e6a7a;
            margin-left: 0.3rem;
            opacity: 0.8;
        }
        .sub {
            color: #2c5770;
            margin-bottom: 1.8rem;
            font-size: 0.95rem;
            border-left: 4px solid #3b8db0;
            padding-left: 1rem;
            background: rgba(59, 141, 176, 0.06);
            border-radius: 0 12px 12px 0;
        }
        .status-panel {
            background: #ffffffcc;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 1.8rem;
            padding: 1.8rem 1.8rem 2rem;
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.02), 0 8px 18px rgba(0, 20, 30, 0.06);
        }
        .metric-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.2rem 1.8rem;
            margin-bottom: 2rem;
        }
        .metric-item {
            display: flex;
            flex-direction: column;
        }
        .metric-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: #3f6b7c;
            font-weight: 600;
            margin-bottom: 0.2rem;
        }
        .metric-value {
            font-size: 2rem;
            font-weight: 550;
            color: #083344;
            line-height: 1.2;
            display: flex;
            align-items: baseline;
            gap: 0.2rem;
            flex-wrap: wrap;
        }
        .metric-unit {
            font-size: 0.9rem;
            font-weight: 400;
            color: #4c7b8c;
            margin-left: 0.1rem;
        }
        .status-badge {
            grid-column: span 2;
            background: #eef5f9;
            border-radius: 3rem;
            padding: 0.6rem 1.2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid #d6e3ec;
        }
        .badge-dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 10px;
            background: #8ba9b9;
            transition: background 0.25s;
        }
        .badge-dot.online {
            background: #2b9c5e;
            box-shadow: 0 0 0 2px #b3e0c9;
        }
        .badge-dot.offline {
            background: #c74a4a;
            box-shadow: 0 0 0 2px #f5cdcd;
        }
        .badge-dot.checking {
            background: #e6b45e;
            box-shadow: 0 0 0 2px #f5e1b0;
        }
        .badge-text {
            font-weight: 500;
            color: #1f495b;
        }
        .action-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-top: 0.25rem;
        }
        .btn {
            background: white;
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 3rem;
            font-weight: 550;
            font-size: 0.95rem;
            color: #083344;
            box-shadow: 0 4px 10px rgba(0, 20, 30, 0.04), 0 1px 3px rgba(0,0,0,0.02);
            border: 1px solid #cbdae5;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: #fafdff;
            flex: 1 1 auto;
            justify-content: center;
        }
        .btn-primary {
            background: #1d5b77;
            border: 1px solid #154c64;
            color: white;
            box-shadow: 0 8px 14px -8px #1d5b7740;
        }
        .btn-primary:hover {
            background: #134f69;
            transform: scale(0.98);
            border-color: #0f435a;
        }
        .btn-primary:active {
            background: #0b3e54;
        }
        .btn-secondary {
            background: #eaf1f7;
            border-color: #c8d8e5;
        }
        .btn-secondary:hover {
            background: #dce8f0;
            border-color: #b0c5d6;
        }
        .btn:disabled {
            opacity: 0.55;
            pointer-events: none;
            filter: grayscale(0.15);
        }
        .log-area {
            margin-top: 1.8rem;
            background: #f2f8fc;
            border-radius: 1.4rem;
            padding: 0.9rem 1.3rem;
            font-size: 0.85rem;
            color: #17485e;
            border: 1px solid #d7e3ec;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
            min-height: 4.2rem;
            transition: background 0.1s;
        }
        .log-icon {
            font-size: 1.2rem;
            opacity: 0.7;
        }
        .log-message {
            word-break: break-word;
            flex: 1;
        }
        .log-timestamp {
            font-size: 0.7rem;
            color: #4a7b8c;
            background: #dde9f2;
            padding: 0.15rem 0.8rem;
            border-radius: 20px;
            white-space: nowrap;
        }
        .footer-meta {
            margin-top: 1.2rem;
            font-size: 0.7rem;
            color: #507b8b;
            text-align: right;
            opacity: 0.7;
            letter-spacing: 0.3px;
        }
        @media (max-width: 480px) {
            .card { padding: 1.5rem; }
            .metric-grid { grid-template-columns: 1fr; gap: 0.8rem; }
            .status-badge { grid-column: span 1; }
            .metric-value { font-size: 1.8rem; }
            .action-bar { flex-direction: column; align-items: stretch; }
            .btn { padding: 0.7rem 1.2rem; }
        }
    </style>
</head>
<body>
<div class="card">
    <h1>
        🌐 网络探测
        <small>· 延迟测试</small>
    </h1>
    <div class="sub">
        ⚡ 测试与公共服务的连接质量 · 基于 HTTP HEAD 请求
    </div>

    <div class="status-panel">
        <div class="metric-grid">
            <div class="metric-item">
                <span class="metric-label">📡 延迟 (平均)</span>
                <div class="metric-value" id="avgLatency">-- <span class="metric-unit">ms</span></div>
            </div>
            <div class="metric-item">
                <span class="metric-label">⏱️ 上次测试</span>
                <div class="metric-value" id="lastLatency">-- <span class="metric-unit">ms</span></div>
            </div>
            <div class="metric-item">
                <span class="metric-label">📊 成功率</span>
                <div class="metric-value" id="successRate">-- <span class="metric-unit">%</span></div>
            </div>
            <div class="metric-item">
                <span class="metric-label">🔁 测试次数</span>
                <div class="metric-value" id="attemptCount">0</div>
            </div>
            <div class="status-badge">
                <span>
                    <span class="badge-dot" id="statusDot"></span>
                    <span class="badge-text" id="statusText">就绪</span>
                </span>
                <span style="font-size:0.8rem; color:#2b5b70;" id="targetDisplay">目标: 公共资源</span>
            </div>
        </div>

        <div class="action-bar">
            <button class="btn btn-primary" id="runTestBtn">▶ 运行测试</button>
            <button class="btn btn-secondary" id="resetBtn">↺ 重置统计</button>
        </div>

        <div class="log-area" id="logArea">
            <span class="log-icon">📋</span>
            <span class="log-message" id="logMessage">点击 “运行测试” 开始网络探测</span>
            <span class="log-timestamp" id="logTimestamp">现在</span>
        </div>
    </div>
    <div class="footer-meta">
        <span>⚡ 每次测试发送 3 个 HEAD 请求 · 超时 5s</span>
    </div>
</div>

<script>
    (function() {
        'use strict';

        // ----- DOM refs -----
        const avgLatencyEl = document.getElementById('avgLatency');
        const lastLatencyEl = document.getElementById('lastLatency');
        const successRateEl = document.getElementById('successRate');
        const attemptCountEl = document.getElementById('attemptCount');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const targetDisplay = document.getElementById('targetDisplay');
        const logMessage = document.getElementById('logMessage');
        const logTimestamp = document.getElementById('logTimestamp');

        const runBtn = document.getElementById('runTestBtn');
        const resetBtn = document.getElementById('resetBtn');

        // ----- 状态 -----
        const state = {
            // 累计统计
            totalAttempts: 0,
            totalSuccess: 0,
            totalLatencySum: 0,      // 所有成功请求的延迟总和 (ms)
            successCount: 0,          // 成功请求次数 (用于计算平均)
            lastLatency: null,        // 最近一次成功延迟 (ms)
            running: false,
        };

        // 测试配置
        const CONFIG = {
            // 使用多个可靠的公共资源，支持 HEAD 且跨域友好
            endpoints: [
                'https://www.google.com/',
                'https://www.cloudflare.com/',
                'https://www.microsoft.com/',
                'https://www.github.com/',
                'https://cdn.jsdelivr.net/npm/axios@1.6.0/package.json',
                // 额外加一个国内可用且快速的资源 (如果在中国大陆)
                'https://www.baidu.com/',
            ],
            requestsPerTest: 3,         // 每次测试发送的请求数
            timeoutMs: 5000,            // 单个请求超时 (ms)
        };

        // ----- 辅助函数 -----
        function formatMs(ms) {
            if (ms === null || ms === undefined || !isFinite(ms)) return '--';
            return Math.round(ms);
        }

        function formatPercent(value) {
            if (state.totalAttempts === 0) return '--';
            return Math.round(value);
        }

        // 更新 UI 统计
        function updateStats() {
            const avg = state.successCount > 0 ? state.totalLatencySum / state.successCount : null;
            avgLatencyEl.innerHTML = (avg !== null ? formatMs(avg) : '--') + ' <span class="metric-unit">ms</span>';

            if (state.lastLatency !== null) {
                lastLatencyEl.innerHTML = formatMs(state.lastLatency) + ' <span class="metric-unit">ms</span>';
            } else {
                lastLatencyEl.innerHTML = '-- <span class="metric-unit">ms</span>';
            }

            const rate = state.totalAttempts > 0 ? (state.totalSuccess / state.totalAttempts) * 100 : null;
            successRateEl.innerHTML = (rate !== null ? formatPercent(rate) : '--') + ' <span class="metric-unit">%</span>';

            attemptCountEl.textContent = state.totalAttempts;

            // 更新状态徽章
            if (state.totalAttempts === 0) {
                statusDot.className = 'badge-dot';
                statusText.textContent = '就绪';
            } else if (state.totalSuccess === 0 && state.totalAttempts > 0) {
                statusDot.className = 'badge-dot offline';
                statusText.textContent = '⚠️ 全失败';
            } else if (state.totalSuccess < state.totalAttempts) {
                statusDot.className = 'badge-dot checking';
                statusText.textContent = '🟡 部分成功';
            } else {
                statusDot.className = 'badge-dot online';
                statusText.textContent = '✅ 在线';
            }

            // 显示目标信息
            targetDisplay.textContent = `目标: ${CONFIG.endpoints.length} 个资源`;
        }

        // 记录日志
        function setLog(msg, isError = false) {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            logMessage.textContent = msg;
            logTimestamp.textContent = timeStr;
            // 如果错误日志，轻微突出
            if (isError) {
                logMessage.style.color = '#b14a4a';
            } else {
                logMessage.style.color = '#17485e';
            }
        }

        // 重置统计
        function resetStats() {
            state.totalAttempts = 0;
            state.totalSuccess = 0;
            state.totalLatencySum = 0;
            state.successCount = 0;
            state.lastLatency = null;
            updateStats();
            setLog('统计已重置，准备测试');
            statusDot.className = 'badge-dot';
            statusText.textContent = '就绪';
            logMessage.style.color = '#17485e';
        }

        // ----- 核心: 单次请求 (返回 promise: 延迟 ms 或 null) -----
        function measureRequest(url, timeoutMs) {
            return new Promise((resolve) => {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => {
                    controller.abort();
                    resolve(null); // 超时视为失败
                }, timeoutMs);

                const startTime = performance.now();

                // 使用 HEAD 请求，轻量且能检测连通性
                fetch(url, {
                    method: 'HEAD',
                    mode: 'cors',        // 跨域请求，部分资源可能不支持，但多数公共资源允许
                    cache: 'no-cache',
                    signal: controller.signal,
                    headers: {
                        'Cache-Control': 'no-cache',
                        'Pragma': 'no-cache'
                    }
                })
                .then(response => {
                    clearTimeout(timeoutId);
                    if (response.ok || response.status < 400) {
                        // 只要服务器有响应就算成功 (HEAD 允许各种状态码, 但 2xx/3xx/4xx 都算可达)
                        const endTime = performance.now();
                        const latency = endTime - startTime;
                        resolve(latency);
                    } else {
                        // 非成功状态码 (但 HEAD 可能返回 405 等, 只要可达也可以考虑)
                        // 为了严格: 只接受 < 400 或者 4xx 但 body 为空? 这里放宽:
                        // 只要是响应了就算成功 (避免把 404 当失败)
                        const endTime = performance.now();
                        const latency = endTime - startTime;
                        resolve(latency);
                    }
                })
                .catch(err => {
                    clearTimeout(timeoutId);
                    // 网络错误 / 跨域 / 中止 都当作失败
                    resolve(null);
                });
            });
        }

        // ----- 执行一轮测试 (3个请求) -----
        async function runTest() {
            if (state.running) return;
            state.running = true;
            runBtn.disabled = true;
            runBtn.textContent = '⏳ 测试中...';
            setLog('正在发送 HEAD 请求 ...');

            // 随机打乱端点，增加公平性
            const shuffled = [...CONFIG.endpoints].sort(() => Math.random() - 0.5);
            // 取前 requestsPerTest 个
            const targets = shuffled.slice(0, CONFIG.requestsPerTest);

            let successLatencies = [];

            for (let i = 0; i < targets.length; i++) {
                const url = targets[i];
                setLog(`请求 ${i+1}/${targets.length}: ${new URL(url).hostname} ...`);
                const latency = await measureRequest(url, CONFIG.timeoutMs);
                state.totalAttempts++;

                if (latency !== null && latency > 0) {
                    successLatencies.push(latency);
                    state.totalSuccess++;
                    state.totalLatencySum += latency;
                    state.successCount++;
                    state.lastLatency = latency;
                } else {
                    // 失败
                    setLog(`⚠️ 请求 ${i+1} 失败 (超时或网络错误)`, true);
                }
                // 每轮更新一次统计 (实时)
                updateStats();

                // 微小延迟避免过快
                if (i < targets.length - 1) {
                    await new Promise(r => setTimeout(r, 200));
                }
            }

            // 本次测试结束
            const successCount = successLatencies.length;
            const total = targets.length;
            if (successCount === 0) {
                setLog(`❌ 所有 ${total} 个请求均失败，请检查网络`, true);
                statusDot.className = 'badge-dot offline';
                statusText.textContent = '⚠️ 离线';
            } else {
                const avg = successLatencies.reduce((a,b) => a+b, 0) / successCount;
                setLog(`✅ 完成 ${total} 个请求，成功 ${successCount} 个，平均延迟 ${Math.round(avg)} ms`);
                statusDot.className = 'badge-dot online';
                statusText.textContent = '✅ 在线';
                // 更新最后延迟为本次平均
                state.lastLatency = avg;
                updateStats();
            }

            state.running = false;
            runBtn.disabled = false;
            runBtn.textContent = '▶ 运行测试';
            // 更新最终统计
            updateStats();
        }

        // ----- 事件绑定 -----
        runBtn.addEventListener('click', () => {
            runTest();
        });

        resetBtn.addEventListener('click', () => {
            if (state.running) return;
            resetStats();
        });

        // 页面初始化
        resetStats();
        setLog('就绪 · 点击 “运行测试” 开始探测');
        // 额外显示端点数量
        targetDisplay.textContent = `目标: ${CONFIG.endpoints.length} 个资源`;

        console.log('🌐 网络探测工具已启动 (HEAD 请求)');
    })();
</script>
</body>
</html>
